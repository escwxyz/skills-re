name: Publish Pagefind Index

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: pagefind-index-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Generate, verify, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTOMATION_API_TOKEN: ${{ secrets.AUTOMATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGEFIND_ASSET_ORIGIN: ${{ vars.PUBLIC_SERVER_URL }}
      PAGEFIND_OUTPUT_ROOT: .pagefind-output/current
      PAGEFIND_R2_BUCKET: skills-re-pagefind-index
      PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25.1.0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test generator and publisher
        run: bun test packages/search-index/src

      - name: Generate and validate index
        run: bun run --cwd packages/search-index generate

      - name: Publish and activate generation
        run: bun run --cwd packages/search-index publish
